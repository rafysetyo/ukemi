[package]
name = "ukemi"
version = "0.1.0"
edition = "2021"
description = "Ukemi: assurance crowdfunding on NEAR. If a campaign misses its target, backers get their principal back plus a share of the creator's Gold Cushion."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
